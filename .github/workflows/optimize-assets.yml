name: Optimize VetFast assets

on:
  push:
    paths:
      - ".optimization-trigger"
      - "scripts/optimize_images.py"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check --quiet pillow

      - name: Convert referenced PNG assets
        run: python scripts/optimize_images.py

      - name: Commit optimized assets
        run: |
          rm -f .optimization-trigger
          if [ -z "$(git status --porcelain)" ]; then
            echo "No asset changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: optimize VetFast assets"
          git push
