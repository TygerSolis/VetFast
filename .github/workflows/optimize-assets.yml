name: Optimize VetFast assets

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Skip generated optimization commit
        if: ${{ github.event.head_commit.message == 'chore: optimize VetFast assets' }}
        run: echo "Optimization commit detected; nothing to do."

      - name: Checkout
        if: ${{ github.event.head_commit.message != 'chore: optimize VetFast assets' }}
        uses: actions/checkout@v4

      - name: Install Pillow
        if: ${{ github.event.head_commit.message != 'chore: optimize VetFast assets' }}
        run: python -m pip install --disable-pip-version-check --quiet pillow

      - name: Convert referenced PNG assets
        if: ${{ github.event.head_commit.message != 'chore: optimize VetFast assets' }}
        run: python scripts/optimize_images.py

      - name: Commit optimized assets
        if: ${{ github.event.head_commit.message != 'chore: optimize VetFast assets' }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No asset changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets scripts
          git add -- '*.html' '*.js' '*.css' '*.json' '*.md' '*.xml' '*.txt'
          git commit -m "chore: optimize VetFast assets"
          git push
